name: tests
on:
  pull_request:
  push:
    branches: [master]
jobs:
  tests:
    # Threshold 100: ifutil.py, keelcli.py, keelbanner.py, dbscreen.py and
    # the Instance menu entries, the database mode screens included,
    # measure 100 percent (419 tests, lines and branches). The
    # package list names the modules with tests; a module is appended as
    # its tests land (COVERAGE.md plan) and the threshold is only ever
    # raised (decision 0006). Baseline before the first test: 0 percent.
    # confconsole.py has tests (the static IPv6 dialog, the usage screen,
    # the mark above it) but is not measured: as a whole it would not reach
    # the threshold, see COVERAGE.md.
    uses: keel-linux/.github/.github/workflows/test-python.yml@main
    with:
      threshold: 100
      package: ifutil,keelbanner,keelcli,dbscreen,plugins.d/Instance
  # A change that ships must come with a changelog entry, or it cannot be
  # installed and never reaches an appliance. The rule and its tests are
  # bin/require-changelog of the .github repository. The check is
  # "package / changelog"; it runs on pull requests only.
  package:
    if: github.event_name == 'pull_request'
    uses: keel-linux/.github/.github/workflows/require-changelog.yml@main
